{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>{% block title %}LATECME - Sistema de Manufatura{% endblock %}</title>

    <!-- Tabler CSS -->
    <link href="{% static 'vendor/tabler/css/tabler.min.css' %}" rel="stylesheet">

    <!-- Custom CSS -->
    <link href="{% static 'css/custom.css' %}" rel="stylesheet">

    {% block extra_css %}{% endblock %}

    <!-- Alpine.js (defer for performance) -->
    <script defer src="{% static 'vendor/alpine/alpine.min.js' %}"></script>
</head>
<body class="{% block body_class %}{% endblock %}">
    {% block body %}
    {% block content %}{% endblock %}
    {% endblock %}

    <!-- Tabler JS -->
    <script src="{% static 'vendor/tabler/js/tabler.min.js' %}"></script>

    <!-- HTMX -->
    <script src="{% static 'vendor/htmx/htmx.min.js' %}"></script>

    <!-- App JS (HTMX/Alpine config) -->
    <script src="{% static 'js/app.js' %}"></script>

    {% block extra_js %}{% endblock %}

    {% block inline_js %}{% endblock %}
</body>
</html>
