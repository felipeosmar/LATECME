{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>{% block title %}LATECME - Sistema de Manufatura{% endblock %}</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="{% static 'images/favicon.svg' %}">

    <!-- Tabler CSS -->
    <link href="{% static 'vendor/tabler/css/tabler.min.css' %}" rel="stylesheet">

    <!-- Alpine.js x-cloak utility -->
    <style>
        [x-cloak] { display: none !important; }
    </style>

    <!-- Custom CSS -->
    <link href="{% static 'css/custom.css' %}" rel="stylesheet">

    {% block extra_css %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
    {% block body %}
    {% block content %}{% endblock %}
    {% endblock %}

    <!-- HTMX (load first) -->
    <script src="{% static 'vendor/htmx/htmx.min.js' %}"></script>

    <!-- Alpine.js (load second) -->
    <script src="{% static 'vendor/alpine/alpine.min.js' %}"></script>

    <!-- Tabler JS -->
    <script src="{% static 'vendor/tabler/js/tabler.min.js' %}"></script>

    <!-- App JS (HTMX/Alpine config - load last) -->
    <script src="{% static 'js/app.js' %}"></script>

    {% block extra_js %}{% endblock %}

    {% block inline_js %}{% endblock %}
</body>
</html>
