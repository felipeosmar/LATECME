{% comment %}
Confirm Dialog Component - Alpine.js powered
Usage:
    Include once in your base template:
    {% include 'components/_confirm_dialog.html' %}

    Then trigger from anywhere:
    <button @click="$dispatch('confirm', {
        title: 'Excluir item?',
        message: 'Esta acao nao pode ser desfeita.',
        confirmText: 'Excluir',
        cancelText: 'Cancelar',
        dangerous: true,
        onConfirm: () => { /* action */ }
    })">Excluir</button>

    Or use with HTMX:
    <button hx-delete="/item/1/"
            hx-confirm="Tem certeza que deseja excluir?">
        Excluir
    </button>
{% endcomment %}
{% load static %}

<div x-data="{
        open: false,
        title: '',
        message: '',
        confirmText: 'Confirmar',
        cancelText: 'Cancelar',
        dangerous: false,
        processing: false,
        onConfirm: null,

        show(options = {}) {
            this.title = options.title || 'Confirmar';
            this.message = options.message || 'Tem certeza que deseja continuar?';
            this.confirmText = options.confirmText || 'Confirmar';
            this.cancelText = options.cancelText || 'Cancelar';
            this.dangerous = options.dangerous || false;
            this.onConfirm = options.onConfirm || null;
            this.processing = false;
            this.open = true;
        },

        async confirm() {
            if (typeof this.onConfirm === 'function') {
                this.processing = true;
                try {
                    await this.onConfirm();
                } catch (e) {
                    console.error('Confirm action failed:', e);
                } finally {
                    this.processing = false;
                }
            }
            this.open = false;
        },

        cancel() {
            this.open = false;
        }
     }"
     @confirm.window="show($event.detail)"
     @keydown.escape.window="cancel()"
     x-cloak>

    <!-- Backdrop -->
    <div class="modal modal-blur fade"
         :class="{ 'show d-block': open }"
         tabindex="-1"
         x-show="open"
         x-transition.opacity>
        <div class="modal-backdrop fade show"></div>

        <div class="modal-dialog modal-sm modal-dialog-centered" role="document"
             x-show="open"
             x-transition:enter="transition ease-out duration-200"
             x-transition:enter-start="opacity-0 transform scale-95"
             x-transition:enter-end="opacity-100 transform scale-100"
             x-transition:leave="transition ease-in duration-150"
             x-transition:leave-start="opacity-100 transform scale-100"
             x-transition:leave-end="opacity-0 transform scale-95"
             @click.outside="cancel()">

            <div class="modal-content">
                <button type="button" class="btn-close" @click="cancel()" aria-label="Close"></button>

                <div class="modal-status" :class="dangerous ? 'bg-danger' : 'bg-primary'"></div>

                <div class="modal-body text-center py-4">
                    <!-- Icon -->
                    <template x-if="dangerous">
                        <svg xmlns="http://www.w3.org/2000/svg" class="icon mb-2 text-danger icon-lg" width="24" height="24" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <use href="{% static 'icons/tabler-sprite.svg' %}#tabler-alert-triangle"></use>
                        </svg>
                    </template>
                    <template x-if="!dangerous">
                        <svg xmlns="http://www.w3.org/2000/svg" class="icon mb-2 text-primary icon-lg" width="24" height="24" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <use href="{% static 'icons/tabler-sprite.svg' %}#tabler-help"></use>
                        </svg>
                    </template>

                    <h3 x-text="title"></h3>
                    <div class="text-muted" x-text="message"></div>
                </div>

                <div class="modal-footer">
                    <div class="w-100">
                        <div class="row">
                            <div class="col">
                                <button type="button"
                                        class="btn w-100"
                                        @click="cancel()"
                                        :disabled="processing"
                                        x-text="cancelText">
                                </button>
                            </div>
                            <div class="col">
                                <button type="button"
                                        class="btn w-100"
                                        :class="dangerous ? 'btn-danger' : 'btn-primary'"
                                        @click="confirm()"
                                        :disabled="processing">
                                    <span x-show="processing" class="spinner-border spinner-border-sm me-2"></span>
                                    <span x-text="confirmText"></span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
