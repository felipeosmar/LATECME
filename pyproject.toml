[project]
name = "latecme"
version = "0.1.0"
description = ""
authors = [
    {name = "Felipe O. de Aviz",email = "felipe@aupi.com.br"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "django (>=5.2.4,<6.0.0)",
    "pillow (>=11.3.0,<12.0.0)",
    "psycopg2-binary (>=2.9.10,<3.0.0)",
    "asgiref (>=3.9.1,<4.0.0)",
    "sqlparse (>=0.5.3,<0.6.0)",
    "typing-extensions (>=4.14.1,<5.0.0)",
    "prettyconf (>=2.3.0,<3.0.0)",
    "gunicorn (>=23.0.0,<24.0.0)"
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0,<1.0.0",
    "mypy>=1.13.0,<2.0.0",
    "bandit>=1.8.0,<2.0.0"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
# Set line length to 88 (Black default, widely used in Python community)
line-length = 88
target-version = "py310"

# Exclude common directories
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "*.pyc",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
    "staticfiles",
    "static",
    "media",
    "migrations",
    "*.egg-info",
    "dist",
    "build",
]

[tool.ruff.lint]
# Select rule sets
select = [
    "E",     # pycodestyle errors
    "F",     # Pyflakes
    "I",     # isort (import sorting)
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "YTT",   # flake8-2020
    "ASYNC", # flake8-async
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "DJ",    # flake8-django
    "DTZ",   # flake8-datetimez
    "T10",   # flake8-debugger
    "EXE",   # flake8-executable
    "ISC",   # flake8-implicit-str-concat
    "ICN",   # flake8-import-conventions
    "PIE",   # flake8-pie
    "Q",     # flake8-quotes
    "RSE",   # flake8-raise
    "RET",   # flake8-return
    "SIM",   # flake8-simplify
    "TID",   # flake8-tidy-imports
    "PTH",   # flake8-use-pathlib
    "PL",    # Pylint
    "RUF",   # Ruff-specific rules
]

# Ignore specific rules that may be too strict for Django projects
ignore = [
    "E501",    # Line too long (handled by formatter)
    "DJ001",   # Avoid using null=True on string-based fields (sometimes needed)
    "RUF012",  # Mutable class attributes (common in Django)
    "PLR0913", # Too many arguments to function call (common in Django views)
    "PLR2004", # Magic value used in comparison (common in Django)
]

# Allow autofix for all enabled rules (when `--fix`) is provided
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
# Ignore specific rules in specific files/directories
"__init__.py" = ["F401"]  # Unused imports in __init__.py
"**/tests/**" = ["PLR2004", "S101"]  # Allow magic values and asserts in tests
"**/test_*.py" = ["PLR2004", "S101"]
"manage.py" = ["T201"]  # Allow print statements in manage.py
"config/settings/*.py" = ["F405"]  # Allow star imports in settings

[tool.ruff.lint.isort]
# isort configuration
known-first-party = ["apps", "config"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.lint.mccabe]
# Maximum cyclomatic complexity
max-complexity = 10

[tool.ruff.format]
# Use double quotes for strings
quote-style = "double"
# Indent with spaces
indent-style = "space"
# Skip magic trailing comma
skip-magic-trailing-comma = false
# Automatically detect the appropriate line ending
line-ending = "auto"
