upstream django {
    server django:8000;
}

server {
    listen 80;
    server_name localhost;
    
    # Increase buffer sizes for development
    client_max_body_size 100M;
    client_body_buffer_size 1M;
    
    # Timeouts for development
    proxy_connect_timeout 600s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    send_timeout 600s;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    
    # Static files
    location /static/ {
        alias /app/staticfiles/;
        expires 1d;
        add_header Cache-Control "public, immutable";
    }
    
    # Media files
    location /media/ {
        alias /app/media/;
        expires 1d;
        add_header Cache-Control "public, immutable";
    }
    
    # Django application
    location / {
        proxy_pass http://django;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_redirect off;
        
        # WebSocket support for Django Channels (if needed)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Development headers
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $server_name;
    }
    
    # Health check endpoint
    location /nginx-health {
        access_log off;
        return 200 "nginx is healthy\n";
        add_header Content-Type text/plain;
    }
    
    # Django admin static files
    location /static/admin/ {
        alias /app/staticfiles/admin/;
    }
    
    # Favicon
    location /favicon.ico {
        alias /app/staticfiles/img/favicon.ico;
        log_not_found off;
        access_log off;
    }
    
    # Robots.txt
    location /robots.txt {
        alias /app/staticfiles/robots.txt;
        log_not_found off;
        access_log off;
    }
}